<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}">
<head>

</head>
<body>

      {{- block "main" . }}{{ end -}}

    {{ partial "footer.html" . }}
  </div>
  {{ partial "cc/scripts.html" . }}
</body>
</html>
