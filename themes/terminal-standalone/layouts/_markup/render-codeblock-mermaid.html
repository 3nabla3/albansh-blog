{{- /*
  ```mermaid code blocks become <pre class="mermaid"> and flag the page, so
  that cc/scripts.html loads Mermaid on this page only.

  Without JavaScript the reader still sees the diagram source.
*/ -}}
<pre class="mermaid">
{{- .Inner | htmlEscape | safeHTML -}}
</pre>
{{- .Page.Store.Set "hasMermaid" true -}}
