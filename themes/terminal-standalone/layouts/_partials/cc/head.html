{{- /*
  Extra <head> content. Call it from the visual theme's head partial, after the
  theme stylesheet.

  - KaTeX stylesheet, only on pages with `math: true` (the scripts are loaded
    at the end of <body> by cc/scripts.html).
*/ -}}
{{- if .Params.math -}}
  {{- with hugo.Data.cdn.katex }}
<link rel="stylesheet" href="{{ .base }}/{{ .css.path }}" integrity="{{ .css.integrity }}" crossorigin="anonymous">
  {{- end }}
{{- end -}}
